# whe063: accelerate.yaml without CPU optimizer offload. With LoRA the Adam state is small, and
# offload needs DeepSpeed's JIT-compiled cpu_adam op; the update is the same AdamW either way.
# Gradient clipping is left to TrainingArguments.max_grad_norm (OPSD's 8B script: 0.1).
compute_environment: LOCAL_MACHINE
debug: false
deepspeed_config:
  deepspeed_multinode_launcher: standard
  offload_optimizer_device: none
  offload_param_device: none
  zero_stage: 2
  gradient_accumulation_steps: auto
distributed_type: DEEPSPEED
downcast_bf16: 'auto'
machine_rank: 0
main_training_function: main
mixed_precision: 'bf16'
num_machines: 1
num_processes: 4
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
